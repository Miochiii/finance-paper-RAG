name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 瘦身依赖：仅测试所需（不装 torch/modelscope 等大件，
      # 测试为纯函数/文件级，无需 GPU 与模型）
      - name: Install test dependencies
        run: pip install numpy scikit-learn hmmlearn tiktoken jieba rank-bm25 qdrant-client python-docx scipy pandas pdfplumber PyMuPDF pillow fastapi uvicorn fastmcp==3.4.7 pydantic pytest python-dotenv

      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider
