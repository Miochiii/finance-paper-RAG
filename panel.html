<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>知识库面板</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 14px; background: #f6f7f9; }
  h2 { font-size: 15px; margin: 8px 0; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .ok { background: #2ecc71; } .bad { background: #e74c3c; }
  button { padding: 6px 12px; border: none; border-radius: 4px; background: #4a6cf7; color: #fff; cursor: pointer; }
  button:hover { background: #3a58d4; }
  button.small { padding: 3px 8px; font-size: 12px; background: #8892a8; }
  #docs-wrap { max-height: 190px; overflow-y: auto; border: 1px solid #ddd; background: #fff; }
  #docs { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
  #docs th, #docs td { border: 1px solid #ddd; padding: 4px 6px; text-align: left; }
  #docs th { background: #eef1f6; position: sticky; top: 0; }
  tr.docrow { cursor: pointer; }
  tr.docrow:hover { background: #eef3ff; }
  #obs-table { width: 100%; border-collapse: collapse; font-size: 11px; background: #fff; }
  #obs-table td { border: 1px solid #eee; padding: 3px 6px; }
  #obs-table td:first-child { background: #fafbfd; color: #667; width: 45%; }
  .obs-empty { font-size: 11px; color: #999; }
  #msg { font-size: 12px; color: #555; min-height: 18px; margin-top: 6px; }
  .chip-sel { display: inline-block; padding: 2px 8px; margin: 2px; border: 1px solid #ccc; border-radius: 999px; cursor: pointer; font-size: 12px; background: #fff; color: #444; }
  .chip-sel.on { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
  .qhit { margin: 6px 0; padding: 6px; border: 1px solid #eee; border-radius: 4px; background: #fff; }
  .qhit .src { color: #4a6cf7; cursor: pointer; font-size: 12px; }
  .qhit .txt { color: #555; font-size: 12px; margin-top: 2px; }
  input, select { padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
  <h2>🔌 服务状态</h2>
  <div class="row">
    <span><span id="dsh-dot" class="dot bad"></span>DSH Agent</span>
  </div>
  <div class="row">
    <button onclick="refresh()">🔄 刷新状态</button>
    <button onclick="apiCall('start_mcp', {}, '正在启动 RAG 服务...')">▶ 启动 RAG 服务</button>
    <button onclick="apiCall('start_dsh', {}, '正在启动 DSH...')">▶ 启动 DSH</button>
  </div>

  <h2>📚 知识库</h2>
  <div class="row">
    <button onclick="ingest()">⚡ 增量更新</button>
    <button onclick="rebuild()">🔨 重建知识库（hmm）</button>
  </div>
  <div class="row">
    <button class="small" onclick="rebuild('hybrid')">hybrid</button>
    <button class="small" onclick="rebuild('discourse')">discourse</button>
    <button class="small" onclick="rebuild('fixed')">fixed</button>
  </div>
  <div id="msg"></div>
  <div id="docs-wrap">
    <table id="docs">
      <thead><tr><th>文档</th><th>块数</th></tr></thead>
      <tbody><tr><td colspan="2">加载中...</td></tr></tbody>
    </table>
  </div>

  <h2>🗂️ 语料管理</h2>
  <div class="row">
    <select id="corpus-sel" style="flex:1"></select>
    <button onclick="corpusSwitch()">切换语料</button>
    <button class="small" onclick="corpusRefresh()">🔄</button>
    <button class="small" onclick="corpusRename()">重命名</button>
    <button class="small" onclick="corpusDelete()">删除</button>
  </div>
  <div id="corpus-info" style="font-size:12px;color:#555;margin:4px 0">加载中...</div>
  <div class="row">
    <input id="corpus-new-name" placeholder="新语料名" style="width:130px">
    <input id="corpus-new-mineru" placeholder="MinerU 输出目录（可选，填了自动后台建库）" style="flex:1">
    <button onclick="corpusCreate()">＋ 新建语料</button>
  </div>

  <h2>🔍 筛选检索</h2>
  <div class="row">
    <input id="q-query" placeholder="检索问题（回车执行）" style="flex:1" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">检索</button>
  </div>
  <div class="row"><span style="font-size:12px;color:#667">方法:</span><span id="q-methods"></span></div>
  <div class="row"><span style="font-size:12px;color:#667">任务:</span><span id="q-tasks"></span></div>
  <div class="row">
    <span style="font-size:12px;color:#667">年份</span>
    <input id="q-y1" type="number" placeholder="起" style="width:70px"> ~
    <input id="q-y2" type="number" placeholder="止" style="width:70px">
    <span style="font-size:12px;color:#667">作者</span>
    <input id="q-author" placeholder="作者名" style="width:110px">
  </div>
  <div id="q-results" style="max-height:230px;overflow-y:auto;border:1px solid #ddd;background:#fafbfd;padding:6px"></div>

  <h2>📝 综述工作台</h2>
  <div class="row">
    <input id="sv-topic" placeholder="综述主题" style="flex:1">
    <button onclick="svGenerateOutline()">🔍 大纲</button>
  </div>
  <div class="row">
    <select id="ed-topic" style="flex:1"><option>（该语料暂无综述）</option></select>
    <button onclick="openEditor()">🖊️ 打开综述编辑器</button>
  </div>
  <div id="sv-outline" style="margin:6px 0"></div>
  <div class="row">
    <button class="small" onclick="svAddSection()">＋ 添加一节</button>
    <button class="small" onclick="svSaveOutline()">💾 保存大纲</button>
    <button class="small" onclick="svDraft()">✍️ 生成草稿</button>
    <button class="small" onclick="svExport()">📥 导出</button>
  </div>
  <div id="sv-draft" style="margin:6px 0"></div>
  <div id="sv-body-wrap" style="display:none;margin:6px 0">
    <textarea id="sv-body" rows="7" style="width:100%;box-sizing:border-box;font-size:11px"></textarea>
    <div class="row">
      <button class="small" onclick="svSaveBody()">💾 保存此节</button>
      <button class="small" onclick="document.getElementById('sv-body-wrap').style.display='none'">关闭</button>
    </div>
  </div>
  <div id="sv-msg" style="font-size:12px;color:#555;min-height:16px"></div>

  <h2>📊 运行统计 <button class="small" id="obs-toggle" onclick="toggleObs()">收起</button></h2>
  <div id="obs"><div class="obs-empty">加载中...</div></div>

<script>
// —— 运行环境适配：桌面端（pywebview 桥）或浏览器直开（HTTP 兜底）——
// pywebview 的桥在页面加载后才注入：启动逻辑等 'pywebviewready' 事件；
// 浏览器直开时桥永远不来，超时后自动挂 HTTP 兜底 api（服务需开 CORS，已加）。
const HTTP_BASE = 'http://127.0.0.1:8000';
async function httpCall(method, path, body) {
  const r = await fetch(HTTP_BASE + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  return r.json();
}
const httpApi = {
  get_status: async () => {
    let dsh = false;
    try { await fetch('http://127.0.0.1:3080/', { mode: 'no-cors' }); dsh = true; } catch (e) {}
    return { dsh, kb: await httpCall('GET', '/stats') };
  },
  start_mcp: () => ({ ok: false, msg: '浏览器模式：请手动运行 启动RAG服务.bat' }),
  start_dsh: () => ({ ok: false, msg: '浏览器模式：无法启动 DSH' }),
  open_doc: (doc, page) => httpCall('POST', '/open', { doc, page: page || 1 }),
  rebuild: (mode = 'hmm') => { httpCall('POST', '/build', { chunker: mode }); return { ok: true, msg: '重建已提交（后台执行，约 2~5 分钟）' }; },
  ingest: () => { httpCall('POST', '/ingest', {}); return { ok: true, msg: '增量更新已提交（后台执行）' }; },
  last_build: () => ({ ok: null, msg: '浏览器模式无任务记录' }),
  corpus_list: () => httpCall('GET', '/corpus/list'),
  corpus_switch: (name) => httpCall('POST', '/corpus/switch', { name }),
  corpus_create: (name, mineru_out) => httpCall('POST', '/corpus/create', { name, mineru_out: mineru_out || null }),
  corpus_delete: (name, confirm) => httpCall('POST', '/corpus/delete', { name, confirm: !!confirm }),
  corpus_rename: (old, new) => httpCall('POST', '/corpus/rename', { old, new }),
  meta_vocab: () => httpCall('GET', '/meta/vocab'),
  survey_list: () => httpCall('GET', '/survey/list'),
  search_filters: (query, methods, tasks, year_min, year_max, author, top_k) => {
    const filters = {};
    if (methods && methods.length) filters.methods = methods;
    if (tasks && tasks.length) filters.tasks = tasks;
    if (year_min) filters.year_min = Number(year_min);
    if (year_max) filters.year_max = Number(year_max);
    if (author) filters.authors = [author];
    return httpCall('POST', '/search', { query, top_k: top_k || 8, filters });
  },
  open_url: (url) => { window.open(url, '_blank'); return { ok: true, msg: '已打开' }; },
  survey_outline: (topic, outline) => httpCall('POST', '/survey/outline', { topic, outline: outline || null }),
  survey_draft: (topic) => httpCall('POST', '/survey/draft', { topic }),
  survey_status: (topic) => httpCall('GET', '/survey/status?topic=' + encodeURIComponent(topic)),
  survey_section: (topic, section) => httpCall('GET', '/survey/section?topic=' + encodeURIComponent(topic) + '&section=' + encodeURIComponent(section)),
  survey_rewrite: (topic, section, instruction) => httpCall('POST', '/survey/rewrite', { topic, section, instruction }),
  survey_edit: (topic, section, text) => httpCall('POST', '/survey/edit', { topic, section, text }),
  survey_export: (topic) => httpCall('POST', '/survey/export', { topic, format: 'markdown' }),
};
let _booted = false;
function startApp() {
  if (_booted) return;
  _booted = true;
  refresh();
  corpusRefresh();
  loadSurveyTopics();
}
window.addEventListener('pywebviewready', startApp);   // 桌面端：桥就绪后启动
setTimeout(function () {
  if (!(window.pywebview && window.pywebview.api)) {
    window.pywebview = { api: httpApi };               // 浏览器模式：HTTP 兜底
  }
  startApp();
}, 1500);

async function apiCall(name, args, msg) {
  if (msg) document.getElementById('msg').textContent = msg;
  try {
    const r = await window.pywebview.api[name](...Object.values(args));
    if (r && r.ok === false) document.getElementById('msg').textContent = '错误: ' + (r.error || JSON.stringify(r));
    else if (msg) document.getElementById('msg').textContent = (r && r.msg) || '完成';
  } catch (e) {
    document.getElementById('msg').textContent = '调用失败: ' + e;
  }
  refresh();
}

async function refresh() {
  let st = {};
  try { st = await window.pywebview.api.get_status(); } catch (e) { st = {}; }
  const dshDot = document.getElementById('dsh-dot');
  dshDot.className = 'dot ' + (st.dsh ? 'ok' : 'bad');
  const tbody = document.querySelector('#docs tbody');
  const kb = (st.kb && st.kb.by_source) ? st.kb.by_source : null;
  docNames.length = 0;
  if (kb && Object.keys(kb).length) {
    const rows = Object.entries(kb).sort((a, b) => b[1] - a[1])
      .map(([k, v], i) => { docNames[i] = k; return `<tr class="docrow" onclick="openDoc(${i})" title="点击打开文档"><td>${k}</td><td>${v}</td></tr>`; }).join('');
    tbody.innerHTML = rows;
  } else {
    tbody.innerHTML = '<tr><td colspan="2">知识库为空或服务未启动</td></tr>';
  }
  renderObs((st.kb && st.kb.obs) ? st.kb.obs : null);
}

function toggleObs() {
  const box = document.getElementById('obs');
  const btn = document.getElementById('obs-toggle');
  if (box.style.display === 'none') {
    box.style.display = '';
    btn.textContent = '收起';
  } else {
    box.style.display = 'none';
    btn.textContent = '展开';
  }
}

function renderObs(obs) {
  const box = document.getElementById('obs');
  if (!obs || !obs.events_logged) {
    box.innerHTML = '<div class="obs-empty">暂无运行记录（问答/检索后自动统计）</div>';
    return;
  }
  const a = obs.avg_ms || {};
  const c = obs.cache || {};
  const f = (v) => (v === null || v === undefined) ? '—' : v;
  const pct = (r) => (r === null || r === undefined) ? '—' : Math.round(r * 100) + '%';
  const rows = [
    ['问题处理（问答工具 / 搜索）', obs.asks + ' / ' + obs.searches + ' 次' + (obs.ask_errors ? `（问答失败 ${obs.ask_errors}）` : '')],
    ['平均总耗时（改写/检索/生成 ms）', f(a.ask_total) + ' / ' + f(a.query_rewrite) + ' / ' + f(a.retrieve) + ' / ' + f(a.generate)],
    ['检索细分（BM25/向量/重排 ms）', f(a.bm25) + ' / ' + f(a.vector) + ' / ' + f(a.rerank)],
    ['累计成本（估算）', '¥' + (obs.cost_cny ?? 0) + ' · 输入 ' + ((obs.tokens && obs.tokens.in) || 0) + ' tok / 输出 ' + ((obs.tokens && obs.tokens.out) || 0) + ' tok'],
    ['块缓存命中率', pct(c.chunk_hit_rate) + `（中 ${c.chunk_hit} / 未中 ${c.chunk_miss}）`],
    ['嵌入缓存命中率', pct(c.embed_hit_rate) + `（中 ${c.embed_hit} / 未中 ${c.embed_miss}）`],
    ['构建 / 增量更新', obs.builds + ' / ' + obs.ingests + ' 次'],
  ];
  box.innerHTML = '<table id="obs-table">' +
    rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') +
    '</table>';
}

const docNames = [];
async function openDoc(i) {
  const name = docNames[i];
  if (!name) return;
  document.getElementById('msg').textContent = '正在打开: ' + name + ' ...';
  try {
    const r = await window.pywebview.api.open_doc(name);
    if (r && r.ok) document.getElementById('msg').textContent = '已打开: ' + name + (r.note ? '（' + r.note + '）' : '');
    else document.getElementById('msg').textContent = '打开失败: ' + ((r && r.error) || '未知错误');
  } catch (e) {
    document.getElementById('msg').textContent = '打开失败: ' + e;
  }
}

async function rebuild(mode = 'hmm') {
  document.getElementById('msg').textContent = '重建中（约 2~5 分钟）...';
  try {
    const r = await window.pywebview.api.rebuild(mode);
    document.getElementById('msg').textContent = r.msg || '已提交重建任务';
  } catch (e) {
    document.getElementById('msg').textContent = '提交失败: ' + e;
  }
}

async function ingest() {
  document.getElementById('msg').textContent = '增量更新中（检测文件变化，新增文档秒级~分钟级）...';
  try {
    const r = await window.pywebview.api.ingest();
    document.getElementById('msg').textContent = r.msg || '已提交增量更新';
  } catch (e) {
    document.getElementById('msg').textContent = '提交失败: ' + e;
  }
}

// ================= 综述工作台 =================
const sv = { topic: '', outline: [], curSection: null };
const svMsg = (t) => { document.getElementById('sv-msg').textContent = t; };

function svTopic() {
  const t = document.getElementById('sv-topic').value.trim();
  if (!t) { svMsg('请先输入综述主题'); return null; }
  sv.topic = t;
  return t;
}

function svRenderOutline() {
  const box = document.getElementById('sv-outline');
  if (!sv.outline.length) { box.innerHTML = ''; return; }
  box.innerHTML = sv.outline.map((s, i) => `<div class="row" style="margin:4px 0">
    <input value="${s.title.replace(/"/g, '&quot;')}" oninput="sv.outline[${i}].title=this.value" style="flex:1;padding:4px;border:1px solid #ccc;border-radius:4px">
    <button class="small" onclick="svMove(${i},-1)">↑</button>
    <button class="small" onclick="svMove(${i},1)">↓</button>
    <button class="small" onclick="svDel(${i})">✕</button></div>`).join('');
}

async function svGenerateOutline() {
  const t = svTopic(); if (!t) return;
  svMsg('生成大纲中（检索 + LLM，约 10~30 秒）...');
  try {
    const r = await window.pywebview.api.survey_outline(t);
    if (r && r.ok) { sv.outline = r.sections || []; svRenderOutline(); svMsg('大纲已生成，可编辑后保存'); loadSurveyTopics(); }
    else svMsg('失败: ' + ((r && r.error) || '未知'));
  } catch (e) { svMsg('调用失败: ' + e); }
}

function svAddSection() {
  if (!sv.topic) { svMsg('请先输入主题'); return; }
  sv.outline.push({ title: '新节', keywords: [] });
  svRenderOutline();
}

function svMove(i, d) {
  const j = i + d;
  if (j < 0 || j >= sv.outline.length) return;
  [sv.outline[i], sv.outline[j]] = [sv.outline[j], sv.outline[i]];
  svRenderOutline();
}

function svDel(i) { sv.outline.splice(i, 1); svRenderOutline(); }

async function svSaveOutline() {
  const t = svTopic(); if (!t) return;
  if (!sv.outline.length) { svMsg('大纲为空'); return; }
  svMsg('保存大纲中...');
  try {
    const r = await window.pywebview.api.survey_outline(t, sv.outline);
    svMsg(r && r.ok ? '大纲已保存（手动模式）' : '失败: ' + ((r && r.error) || ''));
    loadSurveyTopics();
  } catch (e) { svMsg('调用失败: ' + e); }
}

async function svDraft() {
  const t = svTopic(); if (!t) return;
  svMsg('逐节生成草稿中（每节约 20~40 秒，已生成节自动跳过）...');
  try {
    const r = await window.pywebview.api.survey_draft(t);
    if (r && r.ok) { svMsg(`草稿完成：${r.sections} 节 / ${r.total_chars} 字 / ${r.refs} 条引用`); svRefreshDraft(); loadSurveyTopics(); }
    else svMsg('失败: ' + ((r && r.error) || '未知'));
  } catch (e) { svMsg('调用失败: ' + e); }
}

async function svRefreshDraft() {
  const t = sv.topic; if (!t) return;
  try {
    const r = await window.pywebview.api.survey_status(t);
    if (!r || !r.ok) return;
    const box = document.getElementById('sv-draft');
    const secs = r.sections || [];
    if (!secs.length) { box.innerHTML = ''; return; }
    box.innerHTML = secs.map((s, i) => `<div class="row" style="margin:3px 0">
      <span style="flex:1;font-size:12px">${s.title}（${s.chars}字）</span>
      <button class="small" onclick="svView(${i})">查看</button>
      <button class="small" onclick="svRewrite(${i})">重写</button>
      <button class="small" onclick="svEdit(${i})">编辑</button></div>`).join('');
    sv.draftSecs = secs;
  } catch (e) {}
}

async function svView(i) {
  const t = sv.topic, sec = sv.draftSecs[i]; if (!sec) return;
  try {
    const r = await window.pywebview.api.survey_section(t, sec.title);
    if (r && r.ok) {
      sv.curSection = sec.title;
      document.getElementById('sv-body').value = r.body || '';
      document.getElementById('sv-body-wrap').style.display = 'block';
      svMsg('当前节：' + sec.title);
    } else svMsg('失败: ' + ((r && r.error) || ''));
  } catch (e) { svMsg('调用失败: ' + e); }
}

async function svRewrite(i) {
  const t = sv.topic, sec = sv.draftSecs[i]; if (!sec) return;
  const ins = prompt('修改指令（如：深入对比深度学习与传统方法的优缺点 / 缩短到200字）', '更学术化、更深入');
  if (!ins) return;
  svMsg('重写中（约 20~40 秒）...');
  try {
    const r = await window.pywebview.api.survey_rewrite(t, sec.title, ins);
    if (r && r.ok) { svMsg('已重写：' + r.title); svRefreshDraft(); }
    else svMsg('失败: ' + ((r && r.error) || ''));
  } catch (e) { svMsg('调用失败: ' + e); }
}

async function svEdit(i) { await svView(i); svMsg('直接修改下方文本，点「保存此节」覆盖'); }

async function svSaveBody() {
  if (!sv.curSection) return;
  svMsg('保存中...');
  try {
    const r = await window.pywebview.api.survey_edit(sv.topic, sv.curSection, document.getElementById('sv-body').value);
    svMsg(r && r.ok ? '已保存：' + r.title : '失败: ' + ((r && r.error) || ''));
    svRefreshDraft();
  } catch (e) { svMsg('调用失败: ' + e); }
}

async function svExport() {
  const t = svTopic(); if (!t) return;
  svMsg('导出中...');
  try {
    const r = await window.pywebview.api.survey_export(t);
    svMsg(r && r.ok ? '已导出: ' + r.path : '失败: ' + ((r && r.error) || ''));
    loadSurveyTopics();
  } catch (e) { svMsg('调用失败: ' + e); }
}

// ================= 语料管理（第三步） =================
let corpusItems = [];
let vocab = { methods: [], tasks: [] };
const selFilters = { methods: new Set(), tasks: new Set() };

async function corpusRefresh() {
  try {
    const r = await window.pywebview.api.corpus_list();
    if (!r || !r.ok) {
      document.getElementById('corpus-info').textContent = '语料加载失败: ' + ((r && r.error) || '');
      return;
    }
    corpusItems = r.corpora || [];
    const sel = document.getElementById('corpus-sel');
    sel.innerHTML = corpusItems.map(it =>
      `<option value="${it.name}" ${it.active ? 'selected' : ''}>${it.name}${it.active ? ' ★' : ''}（${it.chunks}块${it.build && it.build.status === 'running' ? ' · 构建中' : ''}）</option>`
    ).join('');
    const cur = corpusItems.find(it => it.active);
    document.getElementById('corpus-info').textContent = cur
      ? `激活语料：${cur.name}（${cur.chunks} 块${cur.build && cur.build.status === 'running' ? '，后台构建中' : ''}）`
      : '无激活语料';
    await vocabRefresh();
    await loadSurveyTopics();   // 综述按语料隔离，切换后同步刷新
  } catch (e) {
    document.getElementById('corpus-info').textContent = '语料加载失败: ' + e;
  }
}

async function corpusSwitch() {
  const name = document.getElementById('corpus-sel').value;
  if (!name) return;
  const msg = document.getElementById('msg');
  msg.textContent = '切换语料到 ' + name + ' ...';
  try {
    const r = await window.pywebview.api.corpus_switch(name);
    msg.textContent = (r && r.ok) ? '已切换到：' + name : '切换失败: ' + ((r && r.error) || '');
  } catch (e) { msg.textContent = '切换失败: ' + e; }
  await refresh();
  await corpusRefresh();
}

async function corpusCreate() {
  const name = document.getElementById('corpus-new-name').value.trim();
  if (!name) { document.getElementById('msg').textContent = '请输入新语料名'; return; }
  const mineru = document.getElementById('corpus-new-mineru').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = '创建语料中' + (mineru ? '（将后台建库，长任务）' : '') + '...';
  try {
    const r = await window.pywebview.api.corpus_create(name, mineru);
    msg.textContent = (r && r.ok) ? (r.msg || '已创建') : '失败: ' + ((r && r.error) || '');
  } catch (e) { msg.textContent = '失败: ' + e; }
  document.getElementById('corpus-new-name').value = '';
  document.getElementById('corpus-new-mineru').value = '';
  setTimeout(corpusRefresh, 2000);
}

async function corpusRename() {
  const name = document.getElementById('corpus-sel').value;
  const neu = prompt('重命名语料为：', name);
  if (!neu || neu.trim() === name) return;
  const msg = document.getElementById('msg');
  try {
    const r = await window.pywebview.api.corpus_rename(name, neu.trim());
    msg.textContent = (r && r.ok) ? ('已重命名：' + name + ' → ' + r.name) : '失败: ' + ((r && r.error) || '');
  } catch (e) { msg.textContent = '失败: ' + e; }
  await refresh();
  await corpusRefresh();
}

async function corpusDelete() {
  const name = document.getElementById('corpus-sel').value;
  if (!window.confirm('确认删除语料「' + name + '」？整个语料目录将被删除，不可恢复！')) return;
  const msg = document.getElementById('msg');
  try {
    const r = await window.pywebview.api.corpus_delete(name, true);
    msg.textContent = (r && r.ok) ? ('已删除：' + name) : '失败: ' + ((r && r.error) || '');
  } catch (e) { msg.textContent = '失败: ' + e; }
  await refresh();
  await corpusRefresh();
}

// ================= 筛选检索（第三步） =================
async function vocabRefresh() {
  try {
    const r = await window.pywebview.api.meta_vocab();
    if (r && r.ok) vocab = r;
    renderChips('q-methods', 'methods');
    renderChips('q-tasks', 'tasks');
  } catch (e) {}
}

function chipId(key, label) {
  return 'chip-' + key + '-' + label.replace(/[^\w\u4e00-\u9fa5]/g, '_');
}

function renderChips(id, key) {
  const box = document.getElementById(id);
  box.innerHTML = (vocab[key] || []).map(x =>
    `<span class="chip-sel" id="${chipId(key, x.label)}" onclick="toggleChip('${key}','${x.label}')">${x.label}(${x.count})</span>`
  ).join('');
}

function toggleChip(key, label) {
  const s = selFilters[key];
  if (s.has(label)) s.delete(label); else s.add(label);
  const el = document.getElementById(chipId(key, label));
  if (el) el.classList.toggle('on', s.has(label));
}

const qHits = [];
async function doSearch() {
  const q = document.getElementById('q-query').value.trim();
  const box = document.getElementById('q-results');
  if (!q) { document.getElementById('msg').textContent = '请输入检索问题'; return; }
  document.getElementById('msg').textContent = '检索中...';
  try {
    const r = await window.pywebview.api.search_filters(
      q,
      [...selFilters.methods], [...selFilters.tasks],
      document.getElementById('q-y1').value, document.getElementById('q-y2').value,
      document.getElementById('q-author').value.trim()
    );
    if (r && r.ok && r.results) {
      qHits.length = 0;
      qHits.push(...r.results);
      box.innerHTML = qHits.map((x, i) => {
        const m = x.metadata || {};
        return `<div class="qhit">
          <div class="src" onclick="openHit(${i})">📄 ${m.source || '未知'}（第${m.page_start ?? '?'}-${m.page_end ?? '?'}页）</div>
          <div class="txt">${(x.text || '').slice(0, 200)}…</div></div>`;
      }).join('') || '<div style="font-size:12px;color:#999">无结果</div>';
    } else {
      box.innerHTML = '<div style="font-size:12px;color:#c0392b">检索失败: ' + ((r && r.error) || '') + '</div>';
    }
  } catch (e) { box.innerHTML = '调用失败: ' + e; }
  document.getElementById('msg').textContent = '';
}

async function openHit(i) {
  const hit = qHits[i];
  if (!hit) return;
  const m = hit.metadata || {};
  const name = m.source || '';
  const page = m.page_start || 1;   // 跳到该证据块所在页
  try {
    const r = await window.pywebview.api.open_doc(name, page);
    document.getElementById('msg').textContent = (r && r.ok) ? ('已打开: ' + name + '（第' + page + '页）') : '打开失败: ' + ((r && r.error) || '');
  } catch (e) { document.getElementById('msg').textContent = '打开失败: ' + e; }
}

// ================= 综述编辑器入口（第三步） =================
async function loadSurveyTopics() {
  try {
    const r = await window.pywebview.api.survey_list();
    if (r && r.ok) {
      const topics = r.topics || [];
      document.getElementById('ed-topic').innerHTML = topics.length
        ? topics.map(t => `<option value="${t.topic}">${t.topic}${t.has_draft ? '（草稿）' : ''}</option>`).join('')
        : '<option>（该语料暂无综述）</option>';
    }
  } catch (e) {}
}

async function openEditor() {
  const sel = document.getElementById('ed-topic');
  if (sel.value && sel.selectedIndex >= 0 && sel.options[sel.selectedIndex].value) {
    const url = 'http://127.0.0.1:8000/editor?topic=' + encodeURIComponent(sel.value);
    try {
      const r = await window.pywebview.api.open_url(url);
      document.getElementById('msg').textContent = (r && r.ok) ? '编辑器已在浏览器打开' : '打开失败: ' + ((r && r.error) || '');
    } catch (e) { document.getElementById('msg').textContent = '打开失败: ' + e; }
  } else {
    document.getElementById('msg').textContent = '该语料暂无综述，先去聊天里生成';
  }
}

// 启动由 startApp() 负责（等 pywebview 桥就绪 / 浏览器模式挂 HTTP 兜底）
</script>
</body>
</html>
